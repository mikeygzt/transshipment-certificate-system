spring.application.name=transshipment-api

spring.datasource.url=jdbc:postgresql://localhost:5432/transshipment_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false


app.bootstrap-admin.fullName=${APP_BOOTSTRAP_ADMIN_FULL_NAME:}
app.bootstrap-admin.telephone=${APP_BOOTSTRAP_ADMIN_TELEPHONE:}
app.bootstrap-admin.companyTRN=${APP_BOOTSTRAP_ADMIN_COMPANY_TRN:}
app.bootstrap-admin.shippingAgentName=${APP_BOOTSTRAP_ADMIN_SHIPPING_AGENT_NAME:}
app.bootstrap-admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}